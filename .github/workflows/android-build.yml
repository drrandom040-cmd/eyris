name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "FSQ_API_KEY=${{ secrets.FSQ_API_KEY }}" >> local.properties

      - name: Decode and write google-services.json
        run: |
          CONFIG="${{ secrets.FIREBASE_CONFIG }}"
          if [ -n "$CONFIG" ]; then
            if echo "$CONFIG" | base64 -d > app/google-services.json 2>/dev/null; then
              echo "Decoded base64 FIREBASE_CONFIG"
            else
              echo "$CONFIG" > app/google-services.json
              echo "Wrote raw FIREBASE_CONFIG"
            fi
          else
            echo "{}" > app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/

      - name: Comment on PR with build status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Build successful! APK available in artifacts.'
            })
