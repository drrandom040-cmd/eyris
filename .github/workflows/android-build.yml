name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "FSQ_API_KEY=${{ secrets.FSQ_API_KEY }}" >> local.properties

      - name: Decode and write google-services.json
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [[ $FIREBASE_CONFIG == {* ]]; then
            echo "$FIREBASE_CONFIG" > app/google-services.json
          else
            echo "$FIREBASE_CONFIG" | base64 -d > app/google-services.json
          fi
          python3 -c "
          import json
          with open('app/google-services.json', 'r') as f:
              data = json.load(f)
          if 'client' in data:
              for client in data['client']:
                  if 'client_info' in client and 'android_client_info' in client['client_info']:
                      client['client_info']['android_client_info']['package_name'] = 'com.elsewhere.eyris'
          with open('app/google-services.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/

      - name: Comment on PR with build status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Build successful! APK available in artifacts.'
            })
