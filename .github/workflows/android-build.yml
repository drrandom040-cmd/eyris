name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "FSQ_API_KEY=${{ secrets.FSQ_API_KEY }}" >> local.properties

      - name: Decode and write google-services.json
        run: |
          config="${{ secrets.FIREBASE_CONFIG }}"
          if [ -z "$config" ]; then
            echo "FIREBASE_CONFIG is empty, creating dummy google-services.json"
            echo '{"project_info": {"project_number": "123456789012", "project_id": "eyris-dummy", "storage_bucket": "eyris-dummy.appspot.com"}, "client": [{"client_info": {"mobilesdk_app_id": "1:123456789012:android:12345678901234567890", "android_client_info": {"package_name": "com.elsewhere.eyris"}}, "oauth_client": [], "api_key": [{"current_key": "dummy_api_key"}], "services": {"appinvite_service": {"other_platform_oauth_client": []}}}], "configuration_version": "1"}' > app/google-services.json
          elif echo "$config" | grep -q "^{"; then
            echo "FIREBASE_CONFIG is raw JSON"
            echo "$config" > app/google-services.json
          else
            echo "FIREBASE_CONFIG is base64 encoded"
            echo "$config" | base64 -d > app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/

      - name: Comment on PR with build status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Build successful! APK available in artifacts.'
            })
